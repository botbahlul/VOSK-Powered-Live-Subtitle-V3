plugins {
    id 'com.android.application'
}

android {
    namespace "org.vosk.livesubtitle"
    compileSdk 33

    defaultConfig {
        applicationId "org.vosk.livesubtitle"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    //implementation 'net.java.dev.jna:jna:5.8.0@aar'
    //implementation files('libs/jna-5.8.0.aar')
    //implementation group: 'com.alphacephei', name: 'vosk-android', version: '0.3.32'
    //implementation files('libs/vosk-android-0.3.32.aar')
    implementation project(':models')

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
